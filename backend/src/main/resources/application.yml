# 服务器配置
server:
  port: 8080

# Spring配置
spring:
  application:
    name: notelm-backend
  # 数据库配置
  datasource:
    url: jdbc:postgresql://localhost:5432/notelm
    username: notelm_user
    password: notelm_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  # Redis配置
  redis:
    host: localhost
    port: 6379
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  # JSON配置
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

# 日志配置
logging:
  level:
    com.notelm: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/notelm.log

# 自定义配置
app:
  jwt:
    secret: mySecretKeyForNoteLMApplication  # 应在生产环境中通过环境变量设置
    expiration: 86400000 # 24小时
    refresh-expiration: 604800000 # 7天

# AI服务配置 - 统一管理阿里通义千问配置
ai:
  provider: "aliyun"  # 服务提供商
  qwen:
    api-url: https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation
    model-name: "qwen-max"  # 或 qwen-plus, qwen-turbo
    api-key: ${ALIBABA_API_KEY:your-api-key-here}  # 支持环境变量和默认值
    timeout: 60s  # 请求超时时间
    max-tokens: 2000  # 最大返回token数
    temperature: 0.7  # 创造性参数

# Swagger配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  show-actuator: true